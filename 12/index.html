<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 jailbreak - IFIXSTORE</title>
<style>
  html, body {
        background-color: #0b0d10;
        background-image: radial-gradient(circle at center, #151a21 0%, #0b0d10 100%);
        color: #c8ced8;
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 20px;
    }

  /* الهيدر واللوجو المصغر الأنيق */
  #header {
      text-align: center;
      margin-bottom: 20px;
  }
  #header img {
      width: 270px; /* حجم صغير ومناسب للعين */
          height: auto;
      margin-bottom: 5px;
      border-radius: 13%
  }
  #header .phones {
      font-size: 17px;
      color: #ffffff;
      letter-spacing: 1px;
      font-style: italic;
      font-weight: 800;
  }

  #wrap { 
      width: 600px; 
      background: rgb(36 72 125 / 90%);
      border: 1px solid rgba(88, 116, 163, 0.2);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  }
  
  /* تصميم شريط التقدم */
  #progress-container {
      width: 100%;
      background-color: rgba(30, 39, 50, 0.8);
      border-radius: 6px;
      margin-bottom: 15px;
      overflow: hidden;
      border: 1px solid rgba(88, 116, 163, 0.4);
  }
  #progress-bar {
      width: 0%;
      height: 24px;
      background: linear-gradient(90deg, #1e5799, #2989d8, #207cca);
      text-align: center;
      color: white;
      line-height: 24px;
      font-weight: bold;
      font-size: 13px;
      transition: width 0.3s ease;
  }

  #state { font-size: 18px; font-weight: 700; margin-bottom: 10px; color: #46b176; }
  
  #out { 
      white-space: pre-wrap; 
      font: 11px/1.45 Consolas, monospace;
      background: #080a0d; 
      border: 1px solid #1e2732; 
      border-radius: 6px;
      padding: 10px; 
      height: 160px; 
      overflow-y: auto; 
      color: #c8ced8;
  }

  .ok { color:#7fd0a0; } 
  .bad { color:#c12c15; } 
  .warn { color:#d8c07f; }
</style></head>
<body>

<div id="wrap">
  <!-- شريط التقدم -->
  <div id="progress-container">
    <div id="progress-bar">0%</div>
  </div>

  <div id="state">detecting firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var progressBar = document.getElementById("progress-bar");

    function updateProgress(percent, text) {
        if (progressBar) {
            // ضمان عدم تجاوز النسبة 100%
            var p = Math.min(Math.max(percent, 0), 100);
            progressBar.style.width = p + "%";
            progressBar.textContent = p + "%" + (text ? " - " + text : "");
        }
    }

    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    
    var params = new URLSearchParams(location.search);
    updateProgress(10, "Checking firmware");

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    
    updateProgress(25, "Analyzing system");

    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " >= 12.50";
    } else {
        why = key + " -- no working bug";
    }
    
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + " &middot; bug <b>" + (bug || "none") + "</b> &middot; " + why;

    if (!bug) { 
        updateProgress(100, "Unsupported");
        setState("UNSUPPORTED FIRMWARE", "bad"); 
        return; 
    }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html") + location.search;
    
    function go() { 
        updateProgress(100, "Ready");
        setState("loading " + bug + " chain...", "warn");
        // تأخير بسيط جداً لبرهة ثانية لتتم رؤية اكتمال الـ 100% قبل الانتقال
        setTimeout(function() {
            location.replace(target);
        }, 300);
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        updateProgress(60, "Loading payload");
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        updateProgress(100, "Loaded offline");
        go();
    } else if (clusterStatusIdle(ac)) { // سيتم التعامل مع الحالة العادية
        // الحالة الافتراضية إذا كان مخزناً مسبقاً
        checkIdleState(ac);
    }

    function checkIdleState(ac) {
        if (ac.status === ac.IDLE) {
            setCache("cached", true);
            updateProgress(100, "Cached ready");
            go();
        } else if (ac.status === ac.UPDATEREADY) {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            updateProgress(100, "Update ready");
            waitForTap("UPDATE READY -- press X or tap to reload & run", function () { location.reload(); });
        } else {
            setCache("checking cache...");
            updateProgress(40, "Checking cache");
        }
    }

    // إذا لم يكن في حالة IDLE مباشرة، نتابع الأحداث
    if (ac) {
        ac.addEventListener("downloading", function () { 
            setCache("caching for offline (first run)..."); 
            updateProgress(50, "Downloading cache");
        }, false);
        
        ac.addEventListener("progress", function (e) {
            if (e && e.total && e.total > 0) {
                var p = Math.round((e.loaded / e.total) * 50) + 50; // دمج نسبة التحميل بين 50% و 100%
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
                updateProgress(p, "Caching files");
            } else {
                updateProgress(70, "Caching files");
            }
        }, false);

        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            updateProgress(100, "Caching complete");
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            updateProgress(100, "Update ready");
            waitForTap("UPDATE READY -- press X or tap to reload & run", function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            updateProgress(100, "Offline ready");
            go();
        }, false);
        
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            updateProgress(100, "Cache error");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            updateProgress(100, "Cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }

    function clusterStatusIdle(ac) {
        if(ac.status === ac.IDLE) {
            setCache("cached", true);
            updateProgress(100, "Cached ready");
            go();
            return false;
        }
        return true;
    }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ps4 jailbreak - IFIXSTORE</title>
    <style>
      html, body {
        background-color: #0b0d10;
        background-image: radial-gradient(circle at center, #151a21 0%, #0b0d10 100%);
        color: #c8ced8;
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 20px;
      }

      #wrap { 
        width: 600px; 
        background: rgb(36 72 125 / 90%);
        border: 1px solid rgba(88, 116, 163, 0.2);
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        margin-top: 50px;
        box-sizing: border-box;
        text-align: center;
        height: 80px;

      }

      .brand-logo-img {
    max-width: 455px;
    height: auto;
    display: block;
    margin: 0 auto 20px auto;
    /* إزالة الخلفية البيضاء وتأثير الإضاءة */
    mix-blend-mode: screen; 
    filter: drop-shadow(0px 0px 15px #ffffff) drop-shadow(0px 0px 25px #00d2ff);
    transition: transform 0.3s ease;
}

.brand-logo-img:hover {
    transform: scale(1.05);
}



      /* running: a spinner. jb.js sets body.done / body.fail / body.log. */
      #spin {
        width: 46px;
        height: 46px;
        margin: -10px auto;
        border: 4px solid rgba(30, 39, 50, 0.8);
        border-top-color: #207cca;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        width: 800px;
        max-width: 90vw;
      }
      body.log #state {
        display: block;
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 10px;
        color: #46b176;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 12px/1.45 Consolas, monospace;
        background: rgba(15, 20, 27, 0.8);
        border: 1px solid rgba(88, 116, 163, 0.4);
        border-radius: 6px;
        padding: 12px;
        height: 400px;
        overflow-y: auto;
        color: #c8ced8;
        text-align: left;
      }
      .ok { color: #46b176; }
      .bad { color: #c12c15; }
      .warn { color: #d8c07f; }
      .safe { color: #46b176; }
      .danger { color: #c12c15; }
      code { color: #9fb3d0; }
    </style>
  </head>
  <body>
<img src="logo.png" alt="IFIXSTORE Logo" class="brand-logo-img">
    <div id="wrap">
      <div id="spin"></div>
      <div id="msg"></div>
      <div id="state">running exploit...</div>
      <pre id="out"></pre>
    </div>
 <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
